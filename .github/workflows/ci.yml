name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: shoplite-lab/shoplite-ci-workflows/.github/workflows/java-ci.yml@v1
    permissions:
      contents: read
      packages: read
